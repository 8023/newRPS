syntax = "proto3";

package game;

option go_package = "github.com/doumiao/newRPS/internal/wire";

import "google/protobuf/struct.proto";

// ── 基础 ──────────────────────────────────────────────

message GenderColors {
  string text_color = 1;
  string background_color = 2;
  string border_color = 3;
}

message GenderOption {
  reserved 3; // was faction_id at this number; moved to 4 below, freeing 3 here
  string id = 1;
  string label = 2;
  // 该性别预设归属的阵营 id；空表示不限阵营都能选（兼容历史/测试数据）。
  string faction_id = 4;
}

message GenderFaction {
  reserved 6;
  reserved "genders";
  string id = 1;
  string label = 2;
  string text_color = 3;
  string background_color = 4;
  string border_color = 5;
  // 任务分组：male（生理男）/ female（生理女）/ default（默认兜底），决定系统任务/称号取哪份文案。
  string task_group = 7;
}

message Pos {
  int32 row = 1;
  int32 col = 2;
}

message PublicStats {
  int32 wins = 1;
  int32 losses = 2;
  int32 draws = 3;
  int32 punishments = 4;
  int32 ranked_points = 5;
  string title = 6;
  string title_segment_id = 7;
  int32 highest_score = 8;
  int32 lowest_score = 9;
  // 真实分（未封顶），仅供排行榜排序；展示用 ranked_points/highest_score/lowest_score。
  int32 sort_ranked_points = 10;
  int32 sort_highest_score = 11;
  int32 sort_lowest_score = 12;
  // 管理员在后台手动设置过称号（不随排位分档位变化自动改写），见 title_custom 相关后端逻辑。
  bool title_custom = 13;
  // 累计在线时长（毫秒）。下发时若当前在线，会加上本会话已持续时长。
  int64 total_online_ms = 14;
  // 玩家自设称号，展示优先级：管理员自定义 > 主人为宠物设置的称号 > self_title > 系统自动称号。
  string self_title = 15;
  // 当前 title 的赋予来源："system"/"self"/"master"/"admin"，用于称号标签按来源着色；
  // 见 internal/server/petbond.go 的 applyDisplayTitle。
  string title_source = 16;
  // 按 title_source 从 AppConfig.title_tag_styles 解出的配色，服务端下发时已解析好
  // （与 faction_colors 同模式），前端直接拿来当行内样式用，无需再查配置。
  GenderColors title_colors = 17;
}

message LobbyStats {
  int32 wins = 1;
  int32 losses = 2;
  int32 draws = 3;
  int32 punishments = 4;
  int32 ranked_points = 5;
  string title = 6;
  int32 highest_score = 7;
  int32 lowest_score = 8;
  int32 sort_ranked_points = 9;
  int32 sort_highest_score = 10;
  int32 sort_lowest_score = 11;
  bool title_custom = 12;
  // 累计在线时长（毫秒）。下发时若当前在线，会加上本会话已持续时长。
  int64 total_online_ms = 13;
  // 玩家自设称号，展示优先级：管理员自定义 > 主人为宠物设置的称号 > self_title > 系统自动称号。
  string self_title = 14;
  // 与 PublicStats.title_source 同语义，供称号标签按来源着色。
  string title_source = 15;
  // 与 PublicStats.title_colors 同语义。
  GenderColors title_colors = 16;
}

message GameWLD {
  int32 wins = 1;
  int32 losses = 2;
  int32 draws = 3;
}

message GameStats {
  GameWLD rps = 1;
  GameWLD othello = 2;
  GameWLD tictactoe = 3;
  GameWLD gomoku = 4;
  GameWLD liarsdice = 5;
  GameWLD jungle = 6;
  GameWLD chess = 7;
}

// 完整玩家（房间 / me / player:get）
message PublicPlayer {
  string id = 1;
  string name = 2;
  string gender_id = 3;
  string gender_label = 4;
  string faction_id = 5;
  string avatar_url = 86;
  string faction_label = 6;
  GenderColors faction_colors = 7;
  string display_name = 8;
  bool connected = 9;
  int64 disconnected_at = 10;
  int64 disconnect_expires_at = 12;
  int64 profile_updated_at = 14;

  bool name_war_enabled = 16;
  int64 name_war_toggled_at = 18;
  string name_war_original_name = 20;
  string name_war_penalty_name = 21;
  bool name_war_punished = 22;
  bool name_war_allow_rename = 24;
  int64 name_war_rename_protected_until = 26;
  string name_war_renamed_by = 28;
  string name_war_renamed_by_name = 29;
  int64 name_war_rename_window_started_at = 30;
  int32 name_war_rename_count = 32;

  bool giveaway_enabled = 34;
  double giveaway_value = 36;
  int32 giveaway_clicks = 38;
  string giveaway_board_text = 40;
  int64 giveaway_board_submitted_at = 41;
  int64 giveaway_board_expires_at = 43;
  int32 giveaway_board_likes = 45;
  int32 giveaway_board_dislikes = 47;
  int32 giveaway_board_likes_this_hour = 49;
  int64 giveaway_board_like_window_started_at = 51;
  // 旧版客户端仍依赖这些聚合字段；新客户端的精确额度通过 giveaway:voteQuotas 查询。
  // 保留原字段号，避免升级后旧客户端解析/合并 PublicPlayer 时发生接口断裂。
  int64 giveaway_vote_window_started_at = 53 [deprecated = true];
  int32 giveaway_vote_count = 55 [deprecated = true];
  int32 giveaway_vote_likes_this_hour = 57 [deprecated = true];
  int32 giveaway_vote_dislikes_this_hour = 59 [deprecated = true];

  bool rank_multiplier_unlocked = 61;
  bool extreme_mode_enabled = 63;
  int64 extreme_mode_toggled_at = 65;
  int64 extreme_mode_cooldown_until = 67;
  int32 extreme_win_streak = 69;
  int64 extreme_last_decay_hour = 71;
  bool extreme_force_closed = 73;
  int64 extreme_force_closed_at = 75;
  int64 extreme_rename_protected_until = 77;
  string extreme_renamed_by = 79;
  string extreme_renamed_by_name = 80;

  string room_id = 81;
  bool is_admin = 82;
  PublicStats stats = 84;
  GameStats game_stats = 85;

  // 认主/认宠玩法偏好
  bool bond_master_enabled = 87;
  bool bond_pet_enabled = 88;
  bool bond_public_display = 89;

  // 惩罚标签偏好是仅本人可见的 player:join RAW 应答兄弟字段，不能进入会被广播的
  // PublicPlayer；保留曾在开发版误用过的编号/名字，防止以后再次把私有偏好接进公开结构。
  reserved 90;
  reserved "punishment_tag_prefs";
}

// 大厅精简玩家
message LobbyPlayer {
  string id = 1;
  string name = 2;
  string gender_id = 3;
  string gender_label = 4;
  string faction_id = 5;
  string faction_label = 6;
  GenderColors faction_colors = 7;
  string display_name = 8;
  bool connected = 9;
  int64 disconnected_at = 10;
  int64 disconnect_expires_at = 12;

  bool name_war_enabled = 14;
  string name_war_penalty_name = 16;
  bool name_war_punished = 17;
  bool name_war_allow_rename = 19;
  int64 name_war_rename_protected_until = 21;
  string name_war_renamed_by_name = 23;

  bool giveaway_enabled = 24;
  double giveaway_value = 26;
  string giveaway_board_text = 28;
  int64 giveaway_board_expires_at = 29;
  int32 giveaway_board_likes = 31;
  int32 giveaway_board_dislikes = 33;
  // 旧版大厅客户端会从自己的 LobbyPlayer 合并这些聚合额度字段；保留原字段号。
  int64 giveaway_vote_window_started_at = 52 [deprecated = true];
  int32 giveaway_vote_likes_this_hour = 53 [deprecated = true];
  int32 giveaway_vote_dislikes_this_hour = 54 [deprecated = true];

  bool rank_multiplier_unlocked = 35;
  bool extreme_mode_enabled = 37;
  int32 extreme_win_streak = 39;
  bool extreme_force_closed = 41;
  int64 extreme_force_closed_at = 43;
  int64 extreme_rename_protected_until = 45;
  string extreme_renamed_by_name = 47;

  string room_id = 48;
  LobbyStats stats = 49;
  GameStats game_stats = 50;
  string avatar_url = 51;

  bool bond_master_enabled = 55;
  bool bond_pet_enabled = 56;
  bool bond_public_display = 57;
}

message SeatOccupant {
  oneof kind {
    PublicPlayer player = 1;
  }
  reserved 2; // was bot (BotPlayer)
}

message ChatMessage {
  string id = 1;
  string room_id = 2;
  string player_id = 3;
  string author = 4;
  reserved 5; // 曾是 author_player（发送时刻的玩家快照）；前端现在按 player_id 实时查当前资料
  string author_role = 6;
  string text = 7;
  int64 at = 8;
  bool system = 9;
  bool transient = 10;
  int64 expires_at = 11;
  // 被 @ 的玩家 id；前端 me.id 命中时高亮气泡。chat:new 走动态 RAW 已带此字段，
  // typed ChatMessage（lobbyChat/room.chat/chat:append）也必须保留，避免历史路径静默丢 @。
  repeated string mentions = 12;
  // SQLite 游标（chat:loadOlder 用）；瞬时系统消息可为 0。
  int64 seq = 13;
}

message Suggestion {
  string id = 1;
  string player_id = 2;
  string author = 3;
  PublicPlayer author_player = 4;
  string text = 5;
  int64 at = 6;
}

message RoomSettings {
  string name = 1;
  string password = 2;
  string game_id = 3;
  reserved 4, 5; // was enable_bot, bot_difficulty
  reserved "enable_bot", "bot_difficulty";
  bool enable_punishment = 6;
  // punishment_source 取值：random（随机任务，原 system）| series（系列任务）| player（玩家发布）
  string punishment_source = 7;
  string punishment_id = 8 [deprecated = true];
  repeated string punishment_ids = 9 [deprecated = true];
  string room_background_image = 10;
  bool enable_tags = 11;
  repeated string tags = 12;
  bool allow_proof_image = 13;
  bool tie_double_punish = 15;
  bool require_opponent_confirm = 16;
  bool enable_ranked = 17;
  int32 stake = 18;
  bool enable_rank_multiplier = 19;
  int32 rank_multiplier = 20;
  bool enable_extreme_ranked = 21;
  string othello_board_theme = 22;
  string tictactoe_board_theme = 23;
  int32 liars_dice_min_players = 24;
  int32 liars_dice_max_players = 25;
  string gomoku_board_theme = 26;
  int32 gomoku_undo_limit = 27;
  int32 othello_move_seconds = 28;
  int32 othello_game_minutes = 29;
  int32 gomoku_move_seconds = 30;
  int32 gomoku_game_minutes = 31;
  string jungle_board_theme = 32;
  int32 jungle_move_seconds = 33;
  int32 jungle_game_minutes = 34;
  // 随机任务模式下用户选中/拒绝的标签（无序）；系列任务模式下不用。
  repeated string punishment_tags_included = 35;
  repeated string punishment_tags_excluded = 36;
  // 系列任务模式下选中的系列 ID。
  string punishment_series_id = 37;
  string chess_board_theme = 38;
  int32 chess_move_seconds = 39;
  int32 chess_game_minutes = 40;
  // 各游戏悔棋次数上限：0=禁止（与 gomoku_undo_limit 同一套 0/1/3/10 取值）
  int32 jungle_undo_limit = 41;
  int32 chess_undo_limit = 42;
	int32 othello_undo_limit = 43;
	bool enable_per_piece_punishment = 44;
}

message GomokuUndoRequest {
  string from_seat = 1;
  string to_seat = 2;
  int64 created_at = 3;
  int64 expires_at = 4;
}

message GomokuResignRequest {
  string from_seat = 1;
  string to_seat = 2;
  int64 created_at = 3;
}

message GomokuState {
  repeated BoardRow board = 1;
  string turn = 2;
  string black_seat = 3;
  int32 move_count = 4;
  repeated Pos moves = 5;
  repeated Pos winning_line = 6;
  repeated IntPair ranked_delta = 7;
  repeated IntPair undo_count = 8;
  GomokuUndoRequest undo_request = 9;
  GomokuResignRequest resign_request = 10;
  bool ended = 11;
  string winner = 12;
  int64 move_deadline_at = 13;
  int64 clock_deadline_at = 14;
  repeated IntPair clock_remaining = 15;
  string giveaway_seat = 16;
  string giveaway_forced_by_master_name = 17;
}

message JungleResignRequest {
  string from_seat = 1;
  string to_seat = 2;
  int64 created_at = 3;
}

message JungleUndoRequest {
  string from_seat = 1;
  string to_seat = 2;
  int64 created_at = 3;
  int64 expires_at = 4;
}

message JungleState {
  repeated BoardRow board = 1;
  string turn = 2;
  int32 move_count = 3;
  Pos last_from = 4;
  Pos last_to = 5;
  repeated IntPair ranked_delta = 6;
  JungleResignRequest resign_request = 7;
  bool ended = 8;
  string winner = 9;
  int64 move_deadline_at = 10;
  int64 clock_deadline_at = 11;
  repeated IntPair clock_remaining = 12;
  repeated IntPair undo_count = 13;
  JungleUndoRequest undo_request = 14;
}

message ChessResignRequest {
  string from_seat = 1;
  string to_seat = 2;
  int64 created_at = 3;
}

message ChessUndoRequest {
  string from_seat = 1;
  string to_seat = 2;
  int64 created_at = 3;
  int64 expires_at = 4;
}

message ChessMove {
  Pos from = 1;
  Pos to = 2;
  string promote = 3;
}

message ChessState {
  repeated BoardRow board = 1;
  string turn = 2;
  string white_seat = 3;
  int32 move_count = 4;
  Pos last_from = 5;
  Pos last_to = 6;
  repeated IntPair ranked_delta = 7;
  ChessResignRequest resign_request = 8;
  bool ended = 9;
  string winner = 10;
  int64 move_deadline_at = 11;
  int64 clock_deadline_at = 12;
  repeated IntPair clock_remaining = 13;
  bool castling_white_k = 14;
  bool castling_white_q = 15;
  bool castling_black_k = 16;
  bool castling_black_q = 17;
  Pos en_passant = 18;
  int32 halfmove_clock = 19;
  bool in_check = 20;
  repeated ChessMove legal_moves = 21;
  repeated IntPair undo_count = 22;
  ChessUndoRequest undo_request = 23;
}

message PunishmentProof {
  string player_id = 1;
  string text = 2;
  string image_url = 3;
  string task_text = 4;
  string status = 5;
  string confirmed_by = 6;
  string reviewed_by = 7;
  int64 reviewed_at = 8;
  string reject_reason = 10;
  string redo_task_text = 11;
  int64 submitted_at = 12;
}

message SeatStats {
  int32 wins = 1;
  int32 losses = 2;
  int32 draws = 3;
  int32 punishments = 4;
}

message OthelloScore {
  int32 black = 1;
  int32 white = 2;
}

message PunishmentTask {
  string player_id = 1;
  string player_name = 2;
  string faction_id = 3;
  string faction_label = 4;
  string task_text = 5;
  string background_image = 6;
  double background_opacity = 7;
  string assigned_by = 9;
  string assigned_by_name = 10;
  // type_name：该任务抽取自哪个任务类型（如"真心话"），玩家发布任务模式下为空。
  string type_name = 11;
}

message HistoryProof {
  string player_id = 1;
  string player_name = 2;
  string text = 3;
  string image_url = 4;
  string task_text = 5;
  string status = 6;
  string reviewed_by = 7;
  int64 reviewed_at = 8;
  string reject_reason = 10;
  string redo_task_text = 11;
  int64 submitted_at = 12;
}

message RoundHistoryItem {
  string id = 1;
  int32 round = 2;
  int64 at = 3;
  string player_a = 4;
  string player_b = 5;
  string move_a = 6;
  string move_b = 7;
  string result = 8;
  string result_label = 9;
  string result_text = 10;
  string game_id = 11;
  OthelloScore othello_score = 12;
  string othello_black_seat = 13;
  string tictactoe_x_seat = 14;
  repeated Pos tictactoe_line = 15;
  bool ranked = 16;
  int32 stake = 17;
  int32 rank_multiplier = 19;
  int32 effective_stake = 21;
  bool extreme_ranked = 23;
  string punishment_name = 24;
  // Kept for wire compatibility with history produced by older servers.
  string punishment_description = 25 [deprecated = true];
  repeated PunishmentTask punishment_tasks = 26;
  repeated string punished_names = 27;
  repeated HistoryProof proofs = 28;
  string liars_dice_winner_id = 29;
  string liars_dice_loser_id = 30;
  int32 liars_dice_bid_count = 31;
  int32 liars_dice_bid_face = 32;
  int32 liars_dice_actual_count = 33;
  repeated LiarsDiceHandsPair liars_dice_hands = 34;
  repeated string liars_dice_hand_order = 35;
  repeated StringPair liars_dice_names = 36;
  string gomoku_black_seat = 37;
  repeated Pos gomoku_line = 38;
  string chess_white_seat = 39;
}

message Int32List {
  repeated int32 values = 1;
}

message LiarsDiceHandsPair {
  string key = 1;
  Int32List value = 2;
}

message LiarsDiceBid {
  string player_id = 1;
  int32 count = 2;
  int32 face = 3;
  int64 at = 4;
}

message LiarsDiceState {
  repeated string participant_ids = 1;
  repeated string ready_player_ids = 2;
  repeated IntPair dice_counts = 3;
  string current_turn = 4;
  LiarsDiceBid current_bid = 5;
  repeated LiarsDiceBid bid_history = 6;
  bool ones_wild_disabled = 7;
  int32 round_number = 8;
  bool ended = 9;
  string winner_id = 10;
  string loser_id = 11;
  repeated LiarsDiceHandsPair revealed_hands = 12;
  int32 actual_count = 13;
  int32 min_players = 14;
  int32 max_players = 15;
}

message OthelloPendingSettlement {
  string id = 1;
  string seat = 2;
  string opponent_seat = 3;
  int32 flips = 4;
  int32 stake = 5;
  string next_turn = 6;
  int64 expires_at = 7;
  string forced = 8;
  string resolved_as = 9;
  string forced_by_master_name = 10;
}

message OthelloSurrenderRequest {
  string from_seat = 1;
  string to_seat = 2;
  int64 created_at = 3;
}

message OthelloUndoRequest {
  string from_seat = 1;
  string to_seat = 2;
  int64 created_at = 3;
  int64 expires_at = 4;
}

// 棋盘格："" 空 / "black"|"white" / "X"|"O"
message BoardRow {
  repeated string cells = 1;
}

message IntPair {
  string key = 1;
  int32 value = 2;
}

message OthelloState {
  repeated BoardRow board = 1;
  string turn = 2;
  string black_seat = 3;
  repeated Pos legal_moves = 4;
  int32 pass_count = 5;
  int32 black_count = 6;
  int32 white_count = 7;
  repeated IntPair ranked_delta = 8;
  repeated string settlement_events = 9;
  OthelloPendingSettlement pending_settlement = 10;
  OthelloSurrenderRequest surrender_request = 11;
  bool ended = 12;
  string winner = 13;
  int64 move_deadline_at = 14;
  int64 clock_deadline_at = 15;
  repeated IntPair clock_remaining = 16;
  repeated IntPair undo_count = 17;
  OthelloUndoRequest undo_request = 18;
}

message TicTacToeGiveawayPrompt {
  string seat = 1;
  bool forced = 2;
  int64 started_at = 3;
  int64 expires_at = 4;
}

message TicTacToeState {
  repeated BoardRow board = 1;
  string turn = 2;
  string x_seat = 3;
  int32 move_count = 4;
  TicTacToeGiveawayPrompt giveaway_prompt = 5;
  repeated Pos winning_line = 6;
  repeated IntPair ranked_delta = 7;
  bool ended = 8;
  string winner = 9;
}

message BoolPair {
  string key = 1;
  bool value = 2;
}

message StringPair {
  string key = 1;
  string value = 2;
}

message SeatOccupantPair {
  string key = 1;
  SeatOccupant value = 2;
}

message SeatStatsPair {
  string key = 1;
  SeatStats value = 2;
}

message RoomSnapshot {
  string id = 1;
  reserved 2; // was code (DM-xxxx short room code); removed, use id
  int64 updated_at = 3;
  RoomSettings settings = 4;
  string status = 5;
  string phase = 6;
  repeated SeatOccupantPair seats = 7;
  repeated PublicPlayer spectators = 8;
  repeated BoolPair ready = 9;
  // choices: key seat, value move string or empty
  repeated StringPair choices = 10;
  repeated StringPair revealed_choices = 11;
  OthelloState othello = 12;
  TicTacToeState tictactoe = 13;
  LiarsDiceState liars_dice = 23;
  GomokuState gomoku = 24;
  JungleState jungle = 27;
  ChessState chess = 28;
  string result_text = 14;
  repeated string punished_player_ids = 15;
  repeated PunishmentProof proofs = 16;
  repeated IntPair score = 17;
  repeated IntPair seated_score = 18;
  repeated SeatStatsPair seat_stats = 19;
  repeated RoundHistoryItem round_history = 20;
  int32 round_history_total = 21;
  repeated ChatMessage chat = 22;
  string forgive_advantage_target_id = 25;
  string forgive_advantage_beneficiary_id = 26;
}

message ServerStats {
  int64 started_at = 1;
  int32 room_broadcasts = 2;
  int32 lobby_broadcasts = 3;
  int32 disconnects = 4;
  int32 reconnects = 5;
  int32 last_room_snapshot_bytes = 6;
  int32 last_lobby_snapshot_bytes = 7;
  int32 recent_room_broadcasts = 8;
  int32 recent_lobby_broadcasts = 9;
  int32 average_room_snapshot_bytes = 10;
  int32 average_lobby_snapshot_bytes = 11;
}

message VersusSeat {
  PublicPlayer player = 1;
  reserved 2; // was bot (BotPlayer)
}

message VersusPair {
  string key = 1; // A / B
  VersusSeat value = 2;
}

message LobbyRoomInfo {
  string id = 1;
  string game_id = 2;
  reserved 3; // was code (DM-xxxx); removed, use id
  string name = 4;
  bool has_password = 5;
  int32 players = 6;
  int32 spectators = 7;
  repeated VersusPair versus = 8;
  string status = 9;
  string room_background_image = 10;
  reserved 11, 12; // was enable_bot, bot_difficulty
  reserved "enable_bot", "bot_difficulty";
  bool enable_punishment = 13;
  repeated string punishment_ids = 14;
  string punishment_id = 15;
  bool tie_double_punish = 16;
  bool require_opponent_confirm = 17;
  bool enable_ranked = 18;
  int32 stake = 19;
  bool enable_rank_multiplier = 20;
  int32 rank_multiplier = 21;
  bool enable_extreme_ranked = 22;
  repeated string tags = 23;
  int32 liars_dice_min_players = 24;
  int32 liars_dice_max_players = 25;
  int32 othello_move_seconds = 26;
  int32 othello_game_minutes = 27;
  int32 gomoku_move_seconds = 28;
  int32 gomoku_game_minutes = 29;
  int32 gomoku_undo_limit = 30;
  int32 jungle_move_seconds = 31;
  int32 jungle_game_minutes = 32;
  // 新惩罚选择结构；14/15 旧字段继续保留给旧客户端解码。
  string punishment_source = 33;
  repeated string punishment_tags_included = 34;
  repeated string punishment_tags_excluded = 35;
  string punishment_series_id = 36;
  int32 chess_move_seconds = 37;
  int32 chess_game_minutes = 38;
  int32 jungle_undo_limit = 39;
  int32 chess_undo_limit = 40;
  int32 othello_undo_limit = 41;
}

message LobbyPlayerEntry {
  string id = 1;
  LobbyPlayer player = 2;
}

message LobbyRoomEntry {
  string id = 1;
  LobbyRoomInfo room = 2;
}

// 大厅公开展示的一条主人→宠物边
message PetBondEdge {
  string master_id = 1;
  string pet_id = 2;
  string pet_title = 3;
}

message LobbySnapshot {
  AppConfig config = 1;
  int32 online_count = 2;
  repeated LobbyPlayerEntry players = 3;
  repeated LobbyRoomEntry rooms = 4;
  repeated LobbyPlayer normal_leaderboard = 5;
  repeated LobbyPlayer ranked_leaderboard = 6;
  repeated Suggestion suggestions = 7;
  repeated ChatMessage lobby_chat = 8;
  ServerStats server_stats = 9;
  repeated PetBondEdge pet_bonds = 10;
}

// ── 配置 ──────────────────────────────────────────────

message RoomNamePool {
  repeated string adjectives = 1;
  repeated string subjects = 2;
  repeated string room_words = 3;
}

message RoomInfoTagStyle {
  string label = 1;
  string text_color = 2;
  string background_color = 3;
  string border_color = 4;
}

message RoomInfoTagEntry {
  string key = 1;
  RoomInfoTagStyle style = 2;
}

// 称号标签按赋予来源（system/self/master/admin）着色；形状与 RoomInfoTagStyle 一致，直接复用。
message TitleTagStyleEntry {
  string key = 1;
  RoomInfoTagStyle style = 2;
}

message PunishmentTaskConfig {
  string id = 1;
  string name = 2;
  // Legacy fields keep their original numbers so stored/legacy payloads remain
  // decodable; this does not promise full old-frontend/new-backend interoperability.
  repeated StringPair variants = 3 [deprecated = true];
  repeated string background_images = 4;
  double background_opacity = 5;
  string text = 6;
  repeated string faction_ids = 7;
  int32 order = 8;
  // 随机任务所属标签；可为空（为空时仅供系列按 ID 引用，不进随机池）。
  repeated string tag_ids = 9;
}

message TitleSegment {
  string id = 1;
  // 相对 RankedScore 展示上下限的百分比分段（-100～100）；见服务端 rankedScorePercent。
  double min_percent = 2;
  double max_percent = 3;
  repeated string names = 4;
  // faction_id -> names joined; use nested
  message FactionNames {
    string faction_id = 1;
    repeated string names = 2;
  }
  repeated FactionNames faction_names = 5;
}

// 旧版"任务类型"容器。新版拆成标签 + 拍平任务 + 系列任务，本 message 仅保留
// 字段号以免旧 wire 解码冲突；新服务端不再填充。
message PunishmentConfig {
  option deprecated = true;
  string id = 1;
  string name = 2;
  string description = 3 [deprecated = true];
  repeated StringPair variants = 4 [deprecated = true];
  repeated PunishmentTaskConfig tasks = 5;
  string card_image_url = 6;
  double card_image_opacity = 7;
  repeated string room_background_images = 8;
  RoomNamePool room_name_pool = 9;
  double order_step = 10;
  double order_spread = 11;
  double max_difficulty_overshoot = 12;
}

// 惩罚标签：替代原"任务类型"作为开房筛选维度；同时提供房名词库/背景图库。
message PunishmentTagConfig {
  string id = 1;
  string name = 2;
  RoomNamePool room_name_pool = 3;
  repeated string room_background_images = 4;
}

// 随机任务全局难度参数（不再按类型区分）。
message PunishmentRandomSettings {
  double order_step = 1;
  // 历史字段，倒伽马下不参与计算，保留以免旧配置/控件报错。
  double order_spread = 2;
  double max_difficulty_overshoot = 3;
  // 系列任务某一步没有覆盖受罚者阵营时下发的兜底文案（空则用内置默认）。
  string series_faction_fallback_text = 4;
}

message PunishmentSubtaskVariant {
  repeated string faction_ids = 1;
  string text = 2;
  repeated string background_images = 3;
  double background_opacity = 4;
}

message PunishmentSubtask {
  repeated PunishmentSubtaskVariant variants = 1;
}

message PunishmentSeriesTaskConfig {
  string id = 1;
  string name = 2;
  RoomNamePool room_name_pool = 3;
  repeated string room_background_images = 4;
  // 旧版内联 subtasks/variants；新版系列详情走 SQLite + admin:action，
  // 本字段仅保留字段号以免旧 wire 解码冲突。
  repeated PunishmentSubtask subtasks = 5;
}

// 建房面板公开用的系列任务目录摘要（不含任务文案 / taskIds）。
message PunishmentSeriesSummary {
  string id = 1;
  string name = 2;
  RoomNamePool room_name_pool = 3;
  repeated string room_background_images = 4;
  int32 step_count = 5;
}

message GameConfig {
  string id = 1;
  string name = 2;
  string description = 3;
  // stakes 该游戏建房可选的排位赌分档位，升序；第一个元素为默认档。
  // 黑白棋按每子结算、其余按整局结算，管理员可借不同档位平衡各游戏耗时差异。
  repeated int32 stakes = 4;
}

message AnnouncementBoard {
  bool enabled = 1;
  string title = 2;
  string content = 3;
}

message SecurityDisclaimerConfig {
  bool enabled = 1;
}

message DoublePair {
  string key = 1;
  double value = 2;
}

message ExtremeModeConfig {
  string label = 1;
  string emoji = 2;
  int32 cooldown_hours = 3;
  repeated DoublePair positive_loss_rates = 4;
  repeated DoublePair negative_win_rates = 5;
  repeated DoublePair hourly_decay = 6;
  int32 win_streak_threshold = 7;
  double win_streak_crash_chance = 8;
  int32 crash_target_points = 9;
  string force_close_warning = 10;
  int32 force_rename_min_points = 11;
  int32 force_rename_protect_hours = 12;
}

message SiteConfig {
  string name = 1;
  string description = 2;
  // admin password never sent to clients; keep empty on wire
  string admin_password = 3;
}

message AccessControlConfig {
  int32 max_online_per_ip = 1;
  // 注意：protobufjs 会把本字段编成 maxCreatesPer_10Min（数字前插下划线），
  // 业务侧字段名为 maxCreatesPer10Min；前端 materializeConfig 会做归一化。
  int32 max_creates_per_10_min = 2;
  // 以下字段是纯 IP 维度（不依赖客户端可伪造的浏览器指纹）的兜底上限；
  // 字段名刻意不含裸数字片段，避免重蹈 max_creates_per_10_min 的 protobufjs 命名坑。
  int32 ip_backstop_multiplier = 3;
  int32 ip_backstop_min_limit = 4;
  int32 max_session_issue_per_ip = 5;
  int32 max_online_per_ip_total = 6;
  int32 max_creates_per_ip = 7;
  int32 max_active_rooms_per_owner = 8;
  int32 max_proof_uploads_per_player = 9;
  // 勾选后拒绝一切新建玩家，老用户凭已有身份仍可正常登录。
  bool registration_disabled = 10;
}

message NameWarConfig {
  string penalty_prefix = 1;
  string loser_panel_title = 2;
  string escape_title = 3;
  string rename_panel_title = 4;
  string name_war_loser_label = 5;
  string extreme_force_closed_label = 6;
  // 真实排位分 ≤ 此值时进入名争失格（默认 -4999）。
  int32 penalty_threshold = 7;
  // 真实排位分 ≥ 此值才能给失格者改名（默认 500）。
  int32 rename_min_points = 8;
}

message GiveawayConfig {
  string panel_title = 1;
  string panel_description = 2;
  string submit_placeholder = 3;
  string empty_text = 4;
  // 主动白给（手动选白给 / 点击白给按钮 / RPS 概率强制白给）每次增加的百分比。
  double active_boost_value = 5;
  // 白给已开启的玩家每赢一局（含断线判负）减少的百分比。
  double win_penalty_value = 6;
  // 自救板点赞：每小时可投次数上限、每次降低的百分比。
  int32 like_vote_limit_per_hour = 7;
  double like_vote_value = 8;
  // 自救板倒赞：每小时可投次数上限、每次增加的百分比。
  int32 dislike_vote_limit_per_hour = 9;
  double dislike_vote_value = 10;
  // 以下次数上限、降低/增加百分比都按「投票者 与 被投票者的认主认宠关系」三档独立配置，
  // 且按 actor→target 这一对独立计时/计次（不是投票者的全局总量）。只有直系关系（不含
  // 宠物的宠物等二级以上关系）才会命中宠物/主人档，否则一律走上面的普通档位。
  int32 pet_like_vote_limit_per_hour = 11;
  int32 pet_dislike_vote_limit_per_hour = 12;
  int32 master_like_vote_limit_per_hour = 13;
  int32 master_dislike_vote_limit_per_hour = 14;
  double pet_like_vote_value = 15;
  double pet_dislike_vote_value = 16;
  double master_like_vote_value = 17;
  double master_dislike_vote_value = 18;
}

message PetBondConfig {
  string panel_title = 1;
  int32 max_pets_per_master = 2;
  int32 max_masters_per_pet = 3;
  int32 max_title_length = 4;
}

message AppConfig {
  SiteConfig site = 1;
  AnnouncementBoard announcement_board = 2;
  repeated GenderOption genders = 3;
  repeated GenderFaction gender_factions = 4;
  repeated TitleSegment titles = 5;
  // 旧版任务类型列表；新版改用 punishment_tags + 随机难度参数 + SQLite 任务池/系列。
  repeated PunishmentConfig punishments = 6 [deprecated = true];
  RoomNamePool player_punishment_room_name_pool = 7;
  repeated string room_tags = 8;
  repeated RoomInfoTagEntry room_info_tags = 9;
  AccessControlConfig access_control = 10;
  NameWarConfig name_war = 11;
  GiveawayConfig giveaway = 12;
  ExtremeModeConfig extreme_mode = 13;
  reserved 14; // was bots (BotsConfig)
  reserved "bots";
  repeated GameConfig games = 15;
  repeated StringPair messages = 16;
  SecurityDisclaimerConfig security_disclaimer = 17;
  RankedScoreConfig ranked_score = 18;
  PetBondConfig pet_bond = 19;
  repeated TitleTagStyleEntry title_tag_styles = 20;
  repeated PunishmentTagConfig punishment_tags = 21;
  // 任务池/系列详情已迁 SQLite；字段号保留以免旧 wire 冲突。
  repeated PunishmentTaskConfig punishment_tasks = 22 [deprecated = true];
  repeated PunishmentSeriesTaskConfig punishment_series_tasks = 23 [deprecated = true];
  PunishmentRandomSettings punishment_random_settings = 24;
  // 建房选系列用的公开目录摘要（不含任务文案）。
  repeated PunishmentSeriesSummary punishment_series_summaries = 25;
}

message RankedScoreConfig {
  int32 max = 1;
  int32 min = 2;
  int32 name_war_min = 3;
  double daily_decay_ratio = 4;
}

// 状态通道 FULL 载荷
message StateDocument {
  oneof doc {
    LobbySnapshot lobby = 1;
    RoomSnapshot room = 2;
    AppConfig config = 3;
  }
}

// 玩家批量推送
message PlayerBatch {
  repeated PublicPlayer players = 1;
}

// me / join 响应
message MeState {
  PublicPlayer player = 1;
  string token = 2;
  string room_id = 3;
  RoomSnapshot room = 4;
}

message AnnouncementPayload {
  string id = 1;
  string message = 2;
  int32 duration_ms = 3;
  int64 created_at = 4;
}

message RoomClosed {
  string message = 1;
}

message HistoryPage {
  string room_id = 1;
  RoundHistoryItem item = 2;
  int32 total = 3;
}

message OkResult {
  bool ok = 1;
}

message PlayerResult {
  PublicPlayer player = 1;
}

message SuggestionsResult {
  repeated Suggestion suggestions = 1;
}

// RAW 推送/应答：类型化 oneof + Struct 动态 RPC（Struct 为 protobuf 二进制，非 JSON 文本）
message RawBody {
  oneof body {
    google.protobuf.Struct dynamic = 1;
    PlayerBatch player_batch = 2;
    ChatMessage chat = 3;
    Suggestion suggestion = 4;
    PublicPlayer player = 5;
    MeState me = 6;
    AnnouncementPayload announcement = 7;
    RoomClosed room_closed = 8;
    HistoryPage history_page = 9;
    OkResult ok = 10;
    PlayerResult player_result = 11;
    SuggestionsResult suggestions = 12;
    RoomSnapshot room = 13;
    AppConfig config = 14;
    LobbySnapshot lobby = 15;
  }
}
