syntax = "proto3";

package wire;

option go_package = "github.com/doumiao/newRPS/internal/wire";

import "api/proto/game.proto";
import "google/protobuf/struct.proto";

// WebSocket 二进制信封：全链路 Protobuf，无 JSON 中间层。
// FULL：类型化 StateDocument
// DELTA：路径补丁，value 为 google.protobuf.Value（二进制）
// RAW：RawBody（类型化推送或 Struct 动态 RPC）
message Envelope {
  string event = 1;
  int64 id = 2;
  string err = 3;
  PayloadKind kind = 4;
  string channel = 5;
  uint64 seq = 6;
  // 状态文档 SHA-256 十六进制（FULL 为 proto 字节哈希；DELTA 为合并后文档哈希）
  string hash = 7;
  game.StateDocument full_state = 8;
  StateDelta delta = 9;
  game.RawBody raw_body = 10;
}

enum PayloadKind {
  KIND_RAW = 0;
  KIND_FULL = 1;
  KIND_DELTA = 2;
}

message StateDelta {
  repeated PatchOp ops = 1;
}

message PatchOp {
  // JSON Pointer 风格路径，如 /players/xxx/connected（仅作定位，值非 JSON 文本）
  string path = 1;
  google.protobuf.Value value = 2;
  bool remove = 3;
}
