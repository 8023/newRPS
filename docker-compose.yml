# 抖喵游戏屋 — 官方 Debian slim（无需 Dockerfile）
#
# 推荐：下载 Release 部署包解压后直接：
#   cp .env.example .env   # 可选
#   docker compose up -d
#
# 源码开发本机构建：
#   npm install --prefix web && npm run build
#   docker compose up -d --force-recreate
#
# 基础镜像用 trixie（Debian 13）而非 bookworm（Debian 12）：bin/server 现在依赖
# mattn/go-sqlite3（CGO，动态链接构建机 glibc）。构建机常见的较新发行版
# （如 Ubuntu 24.04，glibc 2.39）编译出的二进制在 bookworm（glibc 2.36）上可能因为
# glibc 版本更低而无法运行；trixie（glibc 2.41）更新，兼容性更有保障。

services:
  gamehouse:
    image: debian:trixie-slim
    container_name: doumiao-gamehouse
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${HOST_PORT:-9988}:9988"
    environment:
      HOST: "0.0.0.0"
      PORT: "9988"
      GO_ENV: "production"
      TZ: "${TZ:-Asia/Shanghai}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBSCRIBER: "${VAPID_SUBSCRIBER:-}"
      SESSION_TTL_MS: "${SESSION_TTL_MS:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      TRUSTED_PROXY_COUNT: "${TRUSTED_PROXY_COUNT:-}"
      LOBBY_BROADCAST_DELAY_MS: "${LOBBY_BROADCAST_DELAY_MS:-}"
      ROOM_BROADCAST_DELAY_MS: "${ROOM_BROADCAST_DELAY_MS:-}"
      MAX_SOCKETS_PER_IP: "${MAX_SOCKETS_PER_IP:-}"
      ANALYTICS_ENABLED: "${ANALYTICS_ENABLED:-}"
      ANALYTICS_GEO_ENABLED: "${ANALYTICS_GEO_ENABLED:-}"
      GEOIP_DB_PATH: "${GEOIP_DB_PATH:-}"
      GEOIP_DB_PATH_V6: "${GEOIP_DB_PATH_V6:-}"
      ANALYTICS_TZ_OFFSET_MIN: "${ANALYTICS_TZ_OFFSET_MIN:-}"
      ANALYTICS_RAW_RETENTION_DAYS: "${ANALYTICS_RAW_RETENTION_DAYS:-}"
    volumes:
      - ./bin/server:/app/server:ro
      - ./dist:/app/dist:ro
      - ./config:/app/config
      - ./work:/app/work
    command: ["/app/server"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
