# 抖喵游戏屋 — 官方 Debian slim + 挂载运行产物（无需 Dockerfile）
#
# 运行产物 bin/server、dist/ 不在 git 中，从 GitHub Release 下载解压到本目录：
#   gh release download vX.Y.Z -p 'newRPS-*-linux-amd64.tar.gz'
#   tar -xzf newRPS-*-linux-amd64.tar.gz
#   cp .env.example .env   # 可选
#   docker compose up -d
#
# 或本机构建：
#   npm install --prefix web && npm run build
#   docker compose up -d

services:
  gamehouse:
    image: debian:bookworm-slim
    container_name: doumiao-gamehouse
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${HOST_PORT:-9988}:9988"
    environment:
      HOST: "0.0.0.0"
      PORT: "9988"
      GO_ENV: "production"
      TZ: "${TZ:-Asia/Shanghai}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      SESSION_TTL_MS: "${SESSION_TTL_MS:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      LOBBY_BROADCAST_DELAY_MS: "${LOBBY_BROADCAST_DELAY_MS:-}"
      ROOM_BROADCAST_DELAY_MS: "${ROOM_BROADCAST_DELAY_MS:-}"
      MAX_SOCKETS_PER_IP: "${MAX_SOCKETS_PER_IP:-}"
    volumes:
      - ./bin/server:/app/server:ro
      - ./dist:/app/dist:ro
      - ./config:/app/config
      - ./data:/app/data
      - ./work:/app/work
    command: ["/app/server"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
